name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (PyPI)
        # 2026-11-06：ghfast 镜像对 releases URL 返回 403，改从 PyPI 安装固定版本，
        # 不依赖 GitHub Releases 直连。
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.0"
          uv --version

      - name: Install dependencies
        # P7 T2：agent extra 进 CI（agent 离线测试为核心能力，桩/内存 stores 不连库）；
        # DB 依赖测试仍以 -m "not db" 跳过。
        run: uv sync --frozen --extra agent

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        # DB 依赖的测试（@pytest.mark.db）需真实 PG+pgvector+Neo4j，CI 跳过；
        # 全量回归靠本地 .env（P4.5 Task 1 纪律）。
        run: uv run pytest -q -m "not db"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Run vitest
        run: npm test