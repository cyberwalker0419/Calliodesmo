# P8 评估语料 v2（data/demo 三件语料同源；chunk_id 与 config/golden_qa.yaml 一致）
#
# 分类（category）：
# - answerable：语料可直接回答（正例）
# - multi_hop：需组合同文档 / 跨文档多条陈述
# - no_answer：语料无答案（期望回答「语料未提及」，不得臆造）
# - distractor：问句含跨文档干扰词，答案只在单一文档
# - injection：问句内嵌诱导指令，期望拒绝执行且只答语料事实
#
# 口径：离线只承诺结构与契约；质量结论由 scripts/eval_p8.py --real 承担。
cases:
  # ---------- answerable（12） ----------
