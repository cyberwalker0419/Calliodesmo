    relevant_chunk_ids: ["public__rare-earth-brief.md#0"]
    mode: "native_rag"
    category: "answerable"
  - id: "qa-v2-002"
    question: "镨钕氧化物有什么用途？"
    expected_answer: "用于制造钕铁硼永磁材料"
