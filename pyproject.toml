[project]
name = "calliodesmo"
version = "0.1.0"
description = "Three-layer knowledge-graph intelligence analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "litellm>=1.85,<1.91",  # >=1.93 无 Windows wheel 需 Rust 工具链编译，钉在纯 Python wheel 区间
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
# BGE-M3 本地嵌入（重型依赖，按需安装）：uv sync --extra embedding-local
embedding-local = ["FlagEmbedding>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[project.scripts]
calliodesmo = "calliodesmo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calliodesmo"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]