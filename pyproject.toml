[project]
name = "calliodesmo"
version = "0.1.0"
description = "Three-layer knowledge-graph intelligence analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",  # FastAPI 表单（OAuth2 密码登录）
    "litellm>=1.85,<1.91",  # >=1.93 无 Windows wheel 需 Rust 工具链编译，钉在纯 Python wheel 区间
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6.0",  # P1：结构化文本（yaml）+ 团队抽取模板配置
]

[project.optional-dependencies]
# BGE-M3 本地嵌入（重型依赖，按需安装）：uv sync --extra embedding-local
embedding-local = ["FlagEmbedding>=1.3"]
# P1 文档解析重依赖（按格式分组，懒加载，缺依赖友好报错）
documents-pdf = ["pypdf>=4.0"]
documents-office = ["python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6"]
documents-opendocument = ["odfpy>=1.4"]
documents-rich = ["striprtf>=0.0.26", "ebooklib>=0.18", "beautifulsoup4>=4.12"]
documents-email = ["extract-msg>=0.48"]
documents-notebooks = ["nbformat>=5.10"]
# 专用文档 OCR：PaddleOCR-VL（重型依赖，懒加载 + 缺依赖友好报错；远端编排可免装）
documents-ocr = ["paddleocr[doc-parser]>=3.6"]
# 可选图分析：networkx Louvain/Leiden
graph-analytics = ["networkx>=3.3"]

# P4.5 持久化真后端（测试环境必须装）：uv sync --extra persistence
# - neo4j：语义层 GraphStore 异步 driver
# - pgvector：情景层/摘要层 Vector 列（pgvector.sqlalchemy.Vector）
persistence = ["neo4j>=5.14", "pgvector>=0.3"]

# P2 检索重依赖（按需安装）
search-rerank = ["FlagEmbedding>=1.3"]  # bge-reranker-v2-m3（与 embedding-local 同族）
search-bm25 = ["rank_bm25>=0.2.2"]  # 可选 BM25 库（默认用自建倒排）
eval-ragas = ["ragas>=0.2"]  # 可选评估库（默认自建轻量指标）

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
calliodesmo = "calliodesmo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calliodesmo"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session 级 loop：session 级 async 夹具（PG engine）跨用例复用同一连接池，避免 asyncpg 跨 loop
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: 依赖真实 PG/Neo4j 的测试（CI 以 -m 'not db' 跳过，全量回归靠本地 .env）",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 中文文案正常全角标点（RUF001/2/3）；B008 为 FastAPI Depends 惯用法
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
# 仿真脚本须在 import calliodesmo 前覆盖环境变量（backend 路由 / JWT secret），故顶层
# import 在赋值语句之后 —— E402 在此为设计所需，单独豁免。
[tool.ruff.lint.per-file-ignores]
"scripts/full_chain_simulation.py" = ["E402"]
